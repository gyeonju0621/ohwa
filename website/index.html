<script type="text/babel">
function Landing() {
  const [open, setOpen] = React.useState(false);
  const cta = () => setOpen(true);
  return <>
    <SiteNav onCTA={cta} /><SiteHero onCTA={cta} /><SiteTry onCTA={cta} /><SiteFive /><SiteStory /><SiteHow /><SiteCTA onCTA={cta} /><SiteFooter />
    {open && <div className="modal" onClick={() => setOpen(false)}>
      <div className="glass" onClick={e => e.stopPropagation()} style={{ width: 360, padding: 30, borderRadius: 40, textAlign: 'center', background: 'var(--glass-strong)', animation: 'ohwa-pop .6s var(--ease-jelly) both' }}>

        <div className="h1" style={{ marginTop: 12 }}>휴대폰으로 열기</div>
        <div style={{ width: 150, height: 150, margin: '18px auto 0', borderRadius: 24, background: 'repeating-linear-gradient(45deg, var(--bg) 0 8px, var(--floor) 8px 9px)', display: 'grid', placeItems: 'center', fontFamily: 'ui-monospace,monospace', fontSize: 11, color: 'var(--fg3)' }}>QR code</div>
        <div style={{ marginTop: 20, display: 'flex', gap: 8, justifyContent: 'center' }}><button className="cta ghost press" onClick={() => setOpen(false)}>닫기</button><a className="cta press" href="../app/?screen=onboard">이 컴퓨터에서 열기</a></div>
      </div>
    </div>}

}
ReactDOM.createRoot(document.getElementById('root')).render(<Landing />);
