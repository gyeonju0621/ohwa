<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4ECE0">
<title>오화 — App</title>
<meta name="description" content="태어난 날로 보는 다섯 기운, 말랑이에게 채우는 하루 — 오화 五和">
<meta property="og:title" content="오화 五和 — 말랑이 감정케어">
<meta property="og:description" content="태어난 날로 보는 다섯 기운, 말랑이에게 채우는 하루">
<meta property="og:image" content="https://gyeonju0621.github.io/ohwa/assets/malangi/body-warm.png">
<link rel="icon" href="../assets/logo/ohwa-seal.svg" type="image/svg+xml">
<style>html,body{margin:0;height:100%;background:#F4ECE0}</style>
<script>
// 이 파일은 바뀌지 않는 '입구'다. 폰(특히 카카오톡 같은 앱 속 브라우저)은 페이지를 오래 기억해 두어 고친 내용이 늦게 보였다.
// 그래서 진짜 앱(main.html)을 열 때마다 시각을 붙여 늘 새로 받게 한다. ?tag=…, ?screen=… 같은 주소 뒤 값은 그대로 넘긴다.
// (main.html이 주소창을 다시 …/app/ 로 정리한다)
try { if (localStorage.getItem('ohwa5-theme') === 'night') document.documentElement.style.background = '#1E1915'; } catch (_) {}
location.replace('main.html' + (location.search ? location.search + '&' : '?') + '_=' + Date.now() + location.hash);
</script>
</head>
<body></body>
</html>
